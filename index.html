<!DOCTYPE html>
<html lang = "eng">
    <head>

    <body>
        <div id="scoreboard" style="
        display: none;
        position: fixed;
        top: 20px;

        <style>
            /* Practice game container */
                #practice-game-area {
                    max-width: 1100px;
                    margin: 0 auto;
                    text-align: center;
                    font-family: Arial, sans-serif;
                }

                #practice-instructions {
                    font-size: 20px;
                    margin: 20px 0;
                    min-height: 50px;
                }

                /* Rock, Paper, Scissors choices */
                #practice-choices {
                    display: flex;
                    justify-content: center;
                    align-items: flex-start;
                    gap: 35px;
                    margin: 25px auto 35px;
                }

                .practice-choice {
                    width: 180px;
                    padding: 10px;
                    border: 2px solid #cccccc;
                    border-radius: 10px;
                    background: #ffffff;
                    cursor: pointer;
                    user-select: none;
                    font-size: 20px;
                    font-weight: bold;
                    transition: transform 0.15s ease, border-color 0.15s ease, background-color 0.15s ease, box-shadow 0.15s ease;
                }

                #practice-choices .practice-choice:hover {
                    border-color: #4a78a8;
                    background-color: #eef5fc; /* Light blue hover background */
                    box-shadow: 0 6px 14px rgba(0, 0, 0, 0.12); /* Subtle card drop shadow */
                    transform: translateY(-4px); /* Moves card up slightly */
                }

                #practice-choices .practice-choice:active {
                    transform: translateY(0) scale(0.97); /* Press effect on click */
                    box-shadow: none;
                }

                .practice-choice img {
                    max-width: 100%;
                    height: auto;
                    pointer-events: none;
                }

                /* Countdown display */
                #practice-selection-area {
                    display: flex;
                    justify-content: center;
                    align-items: center;
                    margin: 20px auto;
                }

                #practice-countdown {
                    width: 150px;
                    font-size: 48px;
                    font-weight: bold;
                }

                #practice-countdown.practice-go {
                    color: #16803c;
                }

                /* Feedback */
                #practice-feedback {
                    margin: 25px auto;
                    padding: 15px;
                    font-size: 25px;
                }

                #practice-feedback h3 {
                    margin-bottom: 10px;
                }

                /*drag and drop styles */
                #game-area {
                display: flex !important;
                flex-direction: column;
                align-items: center;
                width: 100%;
                max-width: 950px;
                margin: 0 auto;
                font-family: 'Oxanium', sans-serif;
                font-weight: 800;
                }

                #game-title{
                    margin: 10px 0px 10px 200px;

                }

                    min-height: 48px;

                    gap: 40px;
                    margin-top: -70px;
                    width: 100%;
                }

                #choices {
                    display: flex;
                    flex-direction: column;
                    width: auto;
                    margin: 0;
                    gap: 20px;
                }

                .choice {
                    border: 2px solid #333;
                    border-radius: 10px;
                    background-color: white;
                    cursor: pointer;
                    font-size: 20px;
                    text-align: center;
                    padding: 6px 12px;
                    user-select: none;

                }

                }

                #drop-box,

                    display: flex;
                    flex-direction: column;

                #drop-box.selected {

                }

                }

                    background-color: rgb(51, 51, 53);

                }

                    border: 3px solid green;
                    background-color: #f1fff7;
                }

                #computer-box.loser {
                    border: 3px solid rgb(156, 0, 0);
                    background-color: #f8b4b4;
                }

                    border: 4px solid #deb40e;
                    background-color: #fff4c7;
                }

                    font-weight: bold;
                    line-height: 1;
                }

                #computer-box img{
                    display: block;
                }

                #enter-instruction {
                    font-size: 30px;
                    margin-top: 35px;
                    text-align: center;
                    min-height: 24px;
                }

                /* Countdown's GO state */
                #countdown.practice-go {
                    color: green;
                }

                /*End screen CSS*/
                #scoreboard{
                    transition: top 0.8s cubic-bezier(0.16, 1, 0.3, 1),
                    right 0.8s cubic-bezier(0.16, 1, 0.3, 1),
                    transform 0.6s cubic-bezier(0.16, 1, 0.3, 1),
                    width 0.8s ease,
                    padding 0.8s ease,
                    background-color 0.8s ease,
                    box-shadow 0.8s ease;
                }

                #scoreboard.summary-mode{
                    top: 50% !important;
                    right: 50% !important;
                    transform: translate(50%, -50%) scale(1.35) !important;
                    width: 280px !important;
                    padding: 20px !important;
                    background-color: #ffffff !important;
                    border: 3px solid #333 !important;
                    border-radius: 12px !important;
                    box-shadow: 0 16px 36px rgba(0, 0, 0, 0.2) !important;
                    text-align: center;
                }

                .earnings-text {
                    display: inline-block;
                    margin-top: 4px;

                    font-weight: 800;

                }

                /* Optional neutral color for secondary/opponent text */
                .earnings-text.secondary {
                    display: inline-block;
                    margin-top: 4px;
                    font-size: 20px;
                    font-weight: 800;
                    color: #495057;
                }

                #match-title, #match-subtitle {
                    transition: opacity 0.4s ease;
                }

                /* End screen container & text transitions */
                #end-screen-wrapper {

                }

                    transition: opacity 0.4s ease;
                }

                /* Continue button styling */
                #summary-continue-btn {

                    width: 200px;
                    height: 60px;
                    font-family: 'Oxanium', sans-serif;
                    font-size: 22px;
                    font-weight: 800;
                    cursor: pointer;
                    border-radius: 8px;
                    border: 1px solid #333;
                    background-color: #f8f9fa;
                    color: #333;
                    margin: 300px auto 0 auto;
                    opacity: 0;
                    transition: opacity 0.2s ease, background-color 0.2s ease;
                }

                #summary-continue-btn:hover {
                    background-color: #e2e6ea;
                }

                /*chatting css*/
                /* Chat Container */
                .chat-window {
                    width: 100%;
                    max-width: 480px;
                    margin: 20px auto;
                    background: #ffffff;
                    border: 1px solid #e0e0e0;
                    border-radius: 16px;
                    box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
                    display: flex;
                    flex-direction: column;
                    overflow: hidden;
                    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
                }

                .chat-header {
                    background: #f8f9fa;
                    padding: 14px 18px;
                    border-bottom: 1px solid #eeeeee;
                    font-size: 15px;
                    font-weight: 600;
                    color: #333;
                    text-align: center;
                }

                /* Scrollable Message List */
                .chat-messages {
                    display: flex;
                    flex-direction: column;
                    gap: 10px;
                    padding: 16px;
                    min-height: 220px;
                    max-height: 320px;
                    overflow-y: auto;
                    background: #fafafa;
                }

                /* Chat Bubbles */
                .chat-bubble {
                    max-width: 80%;
                    padding: 12px 16px;
                    font-size: 14px;
                    line-height: 1.5;
                    overflow-wrap: break-word;
                    text-align: left;
                    box-sizing: border-box;
                    white-space: pre-wrap;
                }

                .chat-status-bar {
                    font-size: 12px;
                    color: #6c757d;
                    text-align: center;
                    padding: 6px 0;
                    background: #f1f3f5;
                    border-bottom: 1px solid #e9ecef;
                    font-style: italic;
                    min-height: 20px;
                    display: flex;
                    align-items: center;
                    justify-content: center;
                }

                /* Opponent Message (Left) */
                .bubble-opponent {
                    align-self: flex-start;
                    background: #e9ecef;
                    color: #212529;
                    border-radius: 16px 16px 16px 4px;
                    animation: fadeIn 0.3s ease-in-out;
                }

                /* Participant Message (Right) */
                .bubble-user {
                    align-self: flex-end;
                    background: #0d6efd;
                    color: #ffffff;
                    border-radius: 16px 16px 4px 16px;
                    animation: fadeIn 0.3s ease-in-out;
                }

                /* Typing Indicator (Left) */
                .typing-indicator {
                    align-self: flex-start;
                    display: flex;
                    align-items: center;
                    gap: 4px;
                    padding: 10px 14px;
                    background: #e9ecef;
                    border-radius: 16px 16px 16px 4px;
                }

                .typing-dot {
                    width: 7px;
                    height: 7px;
                    background-color: #6c757d;
                    border-radius: 50%;
                    animation: typing-anim 1.4s infinite ease-in-out both;
                }

                .typing-dot:nth-child(1) { animation-delay: 0s; }
                .typing-dot:nth-child(2) { animation-delay: 0.2s; }
                .typing-dot:nth-child(3) { animation-delay: 0.4s; }

                @keyframes typing-anim {
                    0%, 80%, 100% { transform: scale(0.6); opacity: 0.4; }
                    40% { transform: scale(1); opacity: 1; }
                }

                @keyframes fadeIn {
                    from { opacity: 0; transform: translateY(6px); }
                    to { opacity: 1; transform: translateY(0); }
                }

                /* Input Area */
                .chat-input-area {
                    display: flex;
                    gap: 8px;
                    padding: 12px;
                    background: #ffffff;
                    border-top: 1px solid #eeeeee;
                }

                .chat-input-area input {
                    flex: 1;
                    padding: 10px 14px;
                    border: 1px solid #ced4da;
                    border-radius: 20px;
                    font-size: 14px;
                    outline: none;
                }

                .chat-input-area input:focus {
                    border-color: #0d6efd;
                }

                .chat-input-area button {
                    padding: 8px 18px;
                    background: #0d6efd;
                    color: white;
                    border: none;
                    border-radius: 20px;
                    font-weight: 600;
                    cursor: pointer;
                }

                .chat-input-area button:disabled {
                    background: #adb5bd;
                    cursor: not-allowed;
                }

                /* Widen the survey page */
                .jspsych-content {
                    max-width: 1200px !important;
                    width: 95% !important;
                }

                /* Widen the Likert response list */
                .jspsych-survey-likert-opts {
                    width: 100% !important;
                    margin: 15px auto !important;
                }

                /* Give the seven options equal widths */
                .jspsych-survey-likert-opts li {
                    width: 14.285% !important;
                    padding: 0 4px !important;
                    box-sizing: border-box !important;
                }

                /* Make labels readable */
                .jspsych-survey-likert-opts li p {
                    font-size: 17px !important;
                    line-height: 1.25 !important;
                    white-space: normal !important;
                }

                /* Enlarge radio buttons */
                .jspsych-survey-likert-opts input[type="radio"] {
                    position: relative;
                    top: -2px;
                    transform: scale(1.5);
                    margin: 0 0 12px 0;
                    vertical-align: middle;
                }
        </style>

<script>
    {/*
    We are running a rock, paper, scissors game between a participant and a computer opponent.
    3 (Outcome: Win, Lose, Tie) x 3 (Information: Luck, Strategy/Skill, None) between-subjects design

    Outline: 
    [x] preload images 
    [x] consent 
    [x] welcome precheck participant's computer speed 
    [x] participant and computer name 
    [x] practice rounds --> make participants drag response and press enter quickly at "GO"
    [x] main game --> need to edit the opponent code 
    [x] post game chat --> information condition manipulation
    [x] filler task 
    [x] DV measures 
    [x] Demos
    [x] Funnel Questions
    [x] Save Data
    [] Debrief and redirect to completion page

    To Do: 
    [x] participant checks --> (1) Full Screen for games [X] and (2) Browser check [X]
    [X] figure out what to do if participant doesn't press enter or select a choice in time
   */}
        
    //record browser interactions/fullscreen minimizations --> need to add this to data saved 
    function summarizeBrowserInteractions() {
        const events = jsPsych.data.getInteractionData().values();
        return {
            browser_blur_count:
                events.filter(e => e.type === "blur").length,
            browser_focus_count:
                events.filter(e => e.type === "focus").length,
            fullscreen_exit_count:
                events.filter(e => e.type === "fullscreenexit").length,
            fullscreen_enter_count:
                events.filter(e => e.type === "fullscreenenter").length
        };
    };

    // experiment set up folder: init jsPsych, preload images, set up basic var (participant name, prolific info, participant_images, computer_images, choices)
        var jsPsych = initJsPsych({
        on_finish: function() {
            // Append interaction summary metrics to all rows in the datasetg
            jsPsych.data.addProperties(summarizeBrowserInteractions());
            }
        });

        var timeline = [];
        var participantName = "You";

        // Generate random subject ID for data filename
        const subject_id = jsPsych.randomization.randomID(10);
        jsPsych.data.addProperties({ subject_id: subject_id });
        const filename = `${subject_id}.csv`;

        var experiment_date = new Date().toISOString().slice(0,10);
        jsPsych.data.addProperties({
        experiment_date: experiment_date
        });

        // capture info from Prolific
        //var subject_id = jsPsych.data.getURLVariable('PROLIFIC_PID'); do not capture prolific PID yet
        var prolific_id = jsPsych.data.getURLVariable('PROLIFIC_PID') || null; 
        var study_id = jsPsych.data.getURLVariable('STUDY_ID') || null;
        var session_id = jsPsych.data.getURLVariable('SESSION_ID') || null;

        var prolific_id_last4 = prolific_id ? prolific_id.slice(-4) : "NA";

        jsPsych.data.addProperties({
            prolific_id_last4: prolific_id_last4,
            study_id: study_id,
            session_id: session_id,
            study: 'RPS_envy_ownership',
            version: 'PilotA'
        });
        // --- Preload images ---
        var preload = {
            type: jsPsychPreload,
            images: [
            //do I want to have different RPS images?
            //do we want "avatars" for the participant and computer to increase the social presence of the game?
            "exp_code/Images/Rock_Computer.png",
            "exp_code/Images/Rock_Participant.png",
            "exp_code/Images/Paper_Computer.png",
            "exp_code/Images/Paper_Participant.png",
            "exp_code/Images/Scissors_Computer.png",
            "exp_code/Images/Scissors_Participant.png",
            "exp_code/Images/Loading_icon.gif", 
            ]
        };
        timeline.push(preload); 

         // --- Game setup ---
        var participant_images = {
            'rock': 'exp_code/Images/Rock_Participant.png',
            'paper': 'exp_code/Images/Paper_Participant.png',
            'scissors': 'exp_code/Images/Scissors_Participant.png'
        };

        var computer_images = {
            'rock': 'exp_code/Images/Rock_Computer.png',
            'paper': 'exp_code/Images/Paper_Computer.png',
            'scissors': 'exp_code/Images/Scissors_Computer.png'
        };

        var choices = ['rock', 'paper', 'scissors'];
    //recaptcha 
        const recaptchaTrial = {
            type: jsPsychHtmlKeyboardResponse,
            choices: "NO_KEYS", // Prevent advancing with keypresses
            stimulus: `
                <div style="text-align: center; max-width: 600px; margin: 0 auto;">
                    <h3>Security Check</h3>
                    <p>Please complete the reCAPTCHA verification below to continue.</p>
                    <div style="display: flex; justify-content: center; margin: 25px 0;">
                        <!-- REPLACE WITH YOUR GOOGLE RECAPTCHA SITE KEY -->
                        <div class="g-recaptcha" data-sitekey="6LdZoAguAAAAAPfhX6MKE1t6_Ei3FXA0W1V1tCcm"></div>
                    </div>
                    <button id="recaptcha-btn" class="jspsych-btn">Continue</button>
                </div>
            `,
            on_load: function() {
                // Explicitly render reCAPTCHA if it hasn't automatically rendered yet
                if (window.grecaptcha && typeof grecaptcha.render === "function") {
                    try {
                        grecaptcha.render(document.querySelector(".g-recaptcha"));
                    } catch (e) {
                        // Auto-rendered by api.js
                    }
                }
                const btn = document.getElementById("recaptcha-btn");
                // Validate on button click
                btn.addEventListener("click", function() {
                    if (typeof grecaptcha !== "undefined" && grecaptcha.getResponse().length > 0) {
                        jsPsych.finishTrial();
                    } else {
                        alert("Please check the 'I'm not a robot' box before continuing.");
                    }
                });
            }
        };
        //timeline.push(recaptchaTrial);
   
   // consent --> add chris' consent and email her 
    var consent ={
    type: jsPsychHtmlButtonResponse,
    stimulus: `
    <p style = "text-align: start; margin-right: 20px; margin-left: 20px"> 
        You are being invited to participate in a research study. This study is being done by Christine Harris,
        Ph.D., and colleagues from UC San Diego. You were selected to participate in this study because you are
        at least 18 years of age.<br><br>
        The purpose of this research study is to explore factors associated with different motivations, attitudes,
        and beliefs. Your participation in this research should last approximately 20-40 minutes. If you agree to
        take part in this study, you will be asked to indicate how much you agree or disagree with various
        statements about personal likes and dislikes, attitudes, mood, dispositions, and interests. Some of these
        questions may relate to matters you consider “personal.” Some may involve asking you about whether
        you know bits of factual information on a topic, such as historical events or news events. You may be
        asked to imagine a hypothetical scenario and make hypothetical decisions or answer questions before
        and/or after the task. You may be asked to recall a past event and answer questions about your feelings,
        attitudes, and behavior. You may be asked to communicate with another participant. You may be asked to
        play a brief competitive game.<br><br>
        Your participation in this study is completely voluntary and you can withdraw at any time. Choosing not
        to participate or withdrawing will result in no penalty or loss of benefits to which you are entitled. You are
        free to skip any question that you choose.<br><br>
        Research sometimes requires that information regarding its purpose not be shared with the research
        participants because its knowledge could impact the results of the research. Note that none of the aspects
        of the research being withheld are reasonably expected to affect your willingness to take part. While the
        tasks you will be asked to perform for this research have been explained, the full intent of the research
        will not be provided until the completion of the study. At that time you will have the opportunity to ask
        questions, including about the purpose of the study and the procedures used, and withdraw your data if
        you so choose.<br><br>
        If you have questions about this project or if you have a research-related problem, you may contact the
        researcher, Christine Harris: charris@ucsd.edu. If you have any questions concerning your rights as a
        research subject, you may contact the UC San Diego Office of IRB Administration at irb@ucsd.edu or
        858-246-4777.<br><br>
        By participating in this research you are indicating that you are at least 18 years old, have read this
        consent form, and agree to participate in this research study. Please keep this consent form for your
        records.
    </p>`,
    choices: ['I Consent', 'I Do Not Consent'],
    data: { task: 'consent' },
    on_finish: function(data){
      if(data.response === 1){
        jsPsych.data.addProperties({ reason: "participant_declined_consent" }); //log reason for non-consent
        
        document.body.innerHTML = `
        <div style="text-align:center; margin-top:100px;">
          <h3>You have chosen not to participate in this study.</h3>
          <p>Thank you for your time. You may now close this window.</p>
          <p>Or, you will be automatically redirected in 5 seconds.</p>
