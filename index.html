<!DOCTYPE html>
<html lang = "eng">
    <head>
        <meta charset="UTF-8">
        <title>Decision Making</title>
        <!-- jsPsych core + plugins -->
        <script src="https://unpkg.com/@jspsych/extension-pipe@0.2.0"></script>
        <script src="https://unpkg.com/jspsych@8.0.0"></script>
        <script src="https://unpkg.com/@jspsych/plugin-html-keyboard-response@2.0.0"></script>
        <script src="https://unpkg.com/@jspsych/plugin-fullscreen@1.2.1"></script>

        <script src="https://unpkg.com/@jspsych/plugin-html-button-response@2.0.0"></script>
        <script src="https://unpkg.com/@jspsych/plugin-preload@2.0.0"></script>
        <script src="https://unpkg.com/@jspsych/plugin-survey-likert@2.0.0"></script>
        <script src="https://unpkg.com/@jspsych/plugin-survey-text@2.0.0"></script>
        <script src="https://unpkg.com/@jspsych/plugin-survey-multi-select@1.1.3"></script>
        <script src="https://unpkg.com/@jspsych/plugin-survey-multi-choice@2.1.0"></script>
        <link href="https://unpkg.com/jspsych@8.0.0/css/jspsych.css" rel="stylesheet" />

    </head>
    <body>
        <div id="scoreboard" style="
        display: none;
        position: fixed;
        top: 20px;
        right: 20px;
        width: 200px;
        background-color: lightblue;
        border: 2px solid black;
        border-radius: 8px;
        padding: 10px;
        color: black;
        font-family: sans-serif;
        z-index: 1000;">
        <strong id = "scoreboard-title">SCOREBOARD</strong><br>
        <span id = "participant-label">You</span>: <span id="player-score">0</span><br>
        <span id="opponent-label">Opponent</span>: <span id="computer-score">0</span>
        </div>
        <style>
            /* Practice game container */
                #practice-game-area {
                    max-width: 1100px;
                    margin: 0 auto;
                    text-align: center;
                    font-family: Arial, sans-serif;
                }

                #practice-instructions {
                    font-size: 20px;
                    margin: 20px 0;
                    min-height: 50px;
                }

                /* Rock, Paper, Scissors choices */
                #practice-choices {
                    display: flex;
                    justify-content: center;
                    align-items: flex-start;
                    gap: 35px;
                    margin: 25px auto 35px;
                }

                .practice-choice {
                    width: 180px;
                    padding: 10px;
                    border: 2px solid #cccccc;
                    border-radius: 10px;
                    background: #ffffff;
                    cursor: grab;
                    user-select: none;
                    font-size: 20px;
                    font-weight: bold;
                }

                .practice-choice img {
                    max-width: 100%;
                    height: auto;
                    pointer-events: none;
                }

                .practice-choice:active {
                    cursor: grabbing;
                }

                /* Countdown and drop box */
                #practice-selection-area {
                    display: flex;
                    justify-content: center;
                    align-items: center;
                    gap: 40px;
                    margin: 20px auto;
                }

                #practice-countdown {
                    width: 150px;
                    font-size: 48px;
                    font-weight: bold;
                }

                #practice-countdown.practice-go {
                    color: #16803c;
                }

                #practice-drop-box {
                    width: 280px;
                    height: 240px;
                    border: 3px dashed #888888;
                    border-radius: 12px;
                    display: flex;
                    flex-direction: column;
                    justify-content: center;
                    align-items: center;
                    background: #f7f7f7;
                    font-size: 18px;
                    flex-shrink: 0;
                }

                #practice-drop-box img {
                    max-width: 180px;
                    max-height: 180px;
                    object-fit: contain;
                }

                #practice-drop-box.practice-selected {
                    border-style: solid;
                    border-color: #4a78a8;
                    background: #eef5fc;
                }

                /* Enter instructions */
                #practice-enter-instruction {
                    margin: 25px auto;
                    min-height: 35px;
                    font-size: 21px;
                }

                /* Feedback */
                #practice-feedback {
                    margin: 25px auto;
                    padding: 15px;
                    font-size: 19px;
                }

                #practice-feedback h3 {
                    margin-bottom: 10px;
                }

                /*drag and drop styles */
                #game-area {
                display: flex !important;
                flex-direction: column;
                align-items: center;
                width: 100%;
                max-width: 950px;
                margin: 0 auto;
                font-family: 'Oxanium', sans-serif;
                font-weight: 800;
                }

                #game-title{
                    margin: 30px 20px 10px 0;
                    font-size: 48px;
                    font-weight: 800;
                    text-align: center;
                    color: #333
                }

                #round-feedback{
                    width: 100%;
                    max-width: 650px;
                    min-height: 48px;
                    margin: 15px 20px auto 10px;
                    padding: 10px 26px;
                    box-sizing: border-box !important;
                    font-family: 'Oxanium', sans-serif;
                    font-size: 18px;
                    font-weight: 600;
                    text-align: center;
                    display: flex;
                    align-items: center;
                    justify-content: center;
                    border-radius: 8px;
                }

                .game-main-row{
                    display: flex;
                    flex-direction: row;
                    flex-wrap: nowrap;
                    align-items: center;
                    justify-content: center;
                    gap: 40px;
                    margin-top: -40px;
                    width: 100%;
                }

                #choices {
                    display: flex;
                    flex-direction: column;
                    width: auto;
                    margin: 0;
                    gap: 20px;
                }

                .choice {
                    border: 2px solid #333;
                    border-radius: 10px;
                    background-color: white;
                    cursor: grab;
                    font-size: 20px;
                    text-align: center;
                    padding: 6px 12px;
                }

                .choice img {
                    display: block;
                    margin: 0 auto
                }

                .choice div {
                    margin-top: 0;
                    margin-bottom: 5px;
                    line-height: 1;
                }

                .choice:active {
                    cursor: grabbing;
                }

                #selection-area {
                    display: flex;
                    flex-direction: column;
                    align-items: center;
                    width: auto;
                    margin: 20px auto;
                }

                #countdown {
                    font-size: 48px;
                    font-weight: bold;
                    height: 55px;
                    margin-bottom: 12px;
                    color: #333;
                }

                #drop-box, 
                #computer-box {
                    width: 300px;
                    height: 250px;
                    border-radius: 15px;
                    display: flex;
                    flex-direction: column;
                    align-items: center;
                    justify-content: center;
                    font-size: 20px;
                    box-sizing: border-box;
                }

                #drop-box {
                    border: 3px dashed #777;
                    background-color: #f9f9f9;
                }

                #drop-box.selected {
                    border: 3px solid black;
                }

                #drop-box.locked {
                    border: 3px solid black;
                }

                #drop-box.winner {
                    border: 3px solid green;
                    background-color: #f1fff7;
                }

                #drop-box.loser {
                    border: 3px solid rgb(156, 0, 0);
                    background-color: #f8b4b4;
                }

                #drop-box.tie {
                    border: 4px solid #deb40e;
                    background-color: #fff4c7;
                }

                #computer-box {
                    border: 3px solid black;
                    background-color: rgb(51, 51, 53);
                    color: white;
                }
                #computer-box.reveal{
                    border: 3px solid black;
                    background-color: transparent;
                }

                #computer-box.winner {
                    border: 3px solid green;
                    background-color: #f1fff7;
                }

                #computer-box.loser {
                    border: 3px solid rgb(156, 0, 0);
                    background-color: #f8b4b4;
                }

                #computer-box.tie {
                    border: 4px solid #deb40e;
                    background-color: #fff4c7;
                }

                #computer-question-mark {
                    font-size: 120px;
                    font-weight: bold;
                    line-height: 1;
                }

                #computer-box img{
                    display: block;
                }

                #enter-instruction {
                    font-size: 30px;
                    margin-top: 35px;
                    text-align: center;
                    min-height: 24px;
                }

                /* Countdown's GO state */
                #countdown.practice-go {
                    color: green;
                }

                /*End screen CSS*/
                #scoreboard{
                    transition: top 0.8s cubic-bezier(0.16, 1, 0.3, 1),
                    right 0.8s cubic-bezier(0.16, 1, 0.3, 1),
                    transform 0.6s cubic-bezier(0.16, 1, 0.3, 1),
                    width 0.8s ease,
                    padding 0.8s ease,
                    background-color 0.8s ease,
                    box-shadow 0.8s ease;
                }
                /*center and enlarge the scoreboard when revealing winner*/ 
                #scoreboard.summary-mode{
                    top: 50% !important;
                    right: 50% !important;
                    transform: translate(50%, -50%) scale(1.35) !important;
                    width: 280px !important;
                    padding: 20px !important;
                    background-color: #ffffff !important;
                    border: 3px solid #333 !important;
                    border-radius: 12px !important;
                    box-shadow: 0 16px 36px rgba(0, 0, 0, 0.2) !important;
                    text-align: center;
                }
                /* Bonus payout badges inside the centered scoreboard */
                .earnings-text {
                    display: inline-block;
                    margin-top: 4px;
                    font-size: 20px;
                    font-weight: 800;
                    color: #198754; /* Clean green text for earnings */
                }

                /* Optional neutral color for secondary/opponent text */
                .earnings-text.secondary {
                    display: inline-block;
                    margin-top: 4px;
                    font-size: 20px;
                    font-weight: 800;
                    color: #495057;
                }

                #match-title, #match-subtitle {
                    transition: opacity 0.4s ease;
                }

                /* End screen container & text transitions */
                #end-screen-wrapper {
                    text-align: center;
                    margin-top: 100px;
                    font-family: 'Oxanium', sans-serif;
                }

                #match-title, #match-subtitle {
                    transition: opacity 0.4s ease;
                }

                /* Continue button styling */
                #summary-continue-btn {
                    display: none;
                    width: 200px;
                    height: 60px;
                    font-family: 'Oxanium', sans-serif;
                    font-size: 22px;
                    font-weight: 800;
                    cursor: pointer;
                    border-radius: 8px;
                    border: 1px solid #333;
                    background-color: #f8f9fa;
                    color: #333;
                    margin: 300px auto 0 auto;
                    opacity: 0;
                    transition: opacity 0.2s ease, background-color 0.2s ease;
                }

                #summary-continue-btn:hover {
                    background-color: #e2e6ea;
                }

                /*chatting css*/
                /* Chat Container */
                .chat-window {
                    width: 100%;
                    max-width: 480px;
                    margin: 20px auto;
                    background: #ffffff;
                    border: 1px solid #e0e0e0;
                    border-radius: 16px;
                    box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
                    display: flex;
                    flex-direction: column;
                    overflow: hidden;
                    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
                }

                .chat-header {
                    background: #f8f9fa;
                    padding: 14px 18px;
                    border-bottom: 1px solid #eeeeee;
                    font-size: 15px;
                    font-weight: 600;
                    color: #333;
                    text-align: center;
                }

                /* Scrollable Message List */
                .chat-messages {
                    display: flex;
                    flex-direction: column;
                    gap: 10px;
                    padding: 16px;
                    min-height: 220px;
                    max-height: 320px;
                    overflow-y: auto;
                    background: #fafafa;
                }

                /* Chat Bubbles */
                .chat-bubble {
                    max-width: 80%;
                    padding: 12px 16px;
                    font-size: 14px;
                    line-height: 1.5;
                    overflow-wrap: break-word;
                    text-align: left;
                    box-sizing: border-box;
                }

                .chat-status-bar {
                    font-size: 12px;
                    color: #6c757d;
                    text-align: center;
                    padding: 6px 0;
                    background: #f1f3f5;
                    border-bottom: 1px solid #e9ecef;
                    font-style: italic;
                    min-height: 20px;
                    display: flex;
                    align-items: center;
                    justify-content: center;
                }

                /* Opponent Message (Left) */
                .bubble-opponent {
                    align-self: flex-start;
                    background: #e9ecef;
                    color: #212529;
                    border-radius: 16px 16px 16px 4px;
                    animation: fadeIn 0.3s ease-in-out;
                }

                /* Participant Message (Right) */
                .bubble-user {
                    align-self: flex-end;
                    background: #0d6efd;
                    color: #ffffff;
                    border-radius: 16px 16px 4px 16px;
                    animation: fadeIn 0.3s ease-in-out;
                }

                /* Typing Indicator (Left) */
                .typing-indicator {
                    align-self: flex-start;
                    display: flex;
                    align-items: center;
                    gap: 4px;
                    padding: 10px 14px;
                    background: #e9ecef;
                    border-radius: 16px 16px 16px 4px;
                }

                .typing-dot {
                    width: 7px;
                    height: 7px;
                    background-color: #6c757d;
                    border-radius: 50%;
                    animation: typing-anim 1.4s infinite ease-in-out both;
                }

                .typing-dot:nth-child(1) { animation-delay: 0s; }
                .typing-dot:nth-child(2) { animation-delay: 0.2s; }
                .typing-dot:nth-child(3) { animation-delay: 0.4s; }

                @keyframes typing-anim {
                    0%, 80%, 100% { transform: scale(0.6); opacity: 0.4; }
                    40% { transform: scale(1); opacity: 1; }
                }

                @keyframes fadeIn {
                    from { opacity: 0; transform: translateY(6px); }
                    to { opacity: 1; transform: translateY(0); }
                }

                /* Input Area */
                .chat-input-area {
                    display: flex;
                    gap: 8px;
                    padding: 12px;
                    background: #ffffff;
                    border-top: 1px solid #eeeeee;
                }

                .chat-input-area input {
                    flex: 1;
                    padding: 10px 14px;
                    border: 1px solid #ced4da;
                    border-radius: 20px;
                    font-size: 14px;
                    outline: none;
                }

                .chat-input-area input:focus {
                    border-color: #0d6efd;
                }

                .chat-input-area button {
                    padding: 8px 18px;
                    background: #0d6efd;
                    color: white;
                    border: none;
                    border-radius: 20px;
                    font-weight: 600;
                    cursor: pointer;
                }

                .chat-input-area button:disabled {
                    background: #adb5bd;
                    cursor: not-allowed;
                }

                /* Widen the survey page */
                .jspsych-content {
                    max-width: 1200px !important;
                    width: 95% !important;
                }

                /* Widen the Likert response list */
                .jspsych-survey-likert-opts {
                    width: 100% !important;
                    margin: 15px auto !important;
                }

                /* Give the seven options equal widths */
                .jspsych-survey-likert-opts li {
                    width: 14.285% !important;
                    padding: 0 4px !important;
                    box-sizing: border-box !important;
                }

                /* Make labels readable */
                .jspsych-survey-likert-opts li p {
                    font-size: 17px !important;
                    line-height: 1.25 !important;
                    white-space: normal !important;
                }

                /* Enlarge radio buttons */
                .jspsych-survey-likert-opts input[type="radio"] {
                    position: relative;
                    top: -2px;
                    transform: scale(1.5);
                    margin: 0 0 12px 0;
                    vertical-align: middle;
                }
        </style>
    </body>
<script>
    {/*
    We are running a rock, paper, scissors game between a participant and a computer opponent.
    3 (Outcome: Win, Lose, Tie) x 3 (Information: Luck, Strategy/Skill, None) between-subjects design

    Outline: 
    [x] preload images 
    [] consent 
    [x] welcome precheck participant's computer speed 
    [x] participant and computer name 
    [x] practice rounds --> make participants drag response and press enter quickly at "GO"
    [x] main game --> need to edit the opponent code 
    [x] post game chat --> information condition manipulation
    [x] filler task 
    [x] DV measures 
    [x] Demos
    [x] Funnel Questions
    [x] Save Data
    [] Debrief and redirect to completion page

    To Do: 
    [x] participant checks --> (1) Full Screen for games [X] and (2) Browser check 
    [X] figure out what to do if participant doesn't press enter or select a choice in time
   */}

   // experiment set up folder: init jsPsych, preload images, set up basic var (participant name, prolific info, participant_images, computer_images, choices)
        var jsPsych = initJsPsych();

        var timeline = [];
        var participantName = "You";

        // Generate random subject ID for data filename
        const subject_id = jsPsych.randomization.randomID(10);
        jsPsych.data.addProperties({ subject_id: subject_id });
        const filename = `${subject_id}.csv`;

        var experiment_date = new Date().toISOString().slice(0,10);
        jsPsych.data.addProperties({
        experiment_date: experiment_date
        });

        // capture info from Prolific
        //var subject_id = jsPsych.data.getURLVariable('PROLIFIC_PID'); do not capture prolific PID yet
        var prolific_id = jsPsych.data.getURLVariable('PROLIFIC_PID') || null; 
        var study_id = jsPsych.data.getURLVariable('STUDY_ID') || null;
        var session_id = jsPsych.data.getURLVariable('SESSION_ID') || null;

        var prolific_id_last4 = prolific_id ? prolific_id.slice(-4) : "NA";

        jsPsych.data.addProperties({
            prolific_id_last4: prolific_id_last4,
            study_id: study_id,
            session_id: session_id,
            study: 'RPS_envy_ownership',
            version: 'PilotA'
        });
        // --- Preload images ---
        var preload = {
            type: jsPsychPreload,
            images: [
            //do I want to have different RPS images?
            //do we want "avatars" for the participant and computer to increase the social presence of the game?
            "exp_code/Images/Rock_Computer.png",
            "exp_code/Images/Rock_Participant.png",
            "exp_code/Images/Paper_Computer.png",
            "exp_code/Images/Paper_Participant.png",
            "exp_code/Images/Scissors_Computer.png",
            "exp_code/Images/Scissors_Participant.png",
            "exp_code/Images/Loading_icon.gif", 
            ]
        };
        timeline.push(preload); 

         // --- Game setup ---
        var participant_images = {
            'rock': 'exp_code/Images/Rock_Participant.png',
            'paper': 'exp_code/Images/Paper_Participant.png',
            'scissors': 'exp_code/Images/Scissors_Participant.png'
        };

        var computer_images = {
            'rock': 'exp_code/Images/Rock_Computer.png',
            'paper': 'exp_code/Images/Paper_Computer.png',
            'scissors': 'exp_code/Images/Scissors_Computer.png'
        };

        var choices = ['rock', 'paper', 'scissors'];
   // consent 
    var consent ={
    type: jsPsychHtmlButtonResponse,
    stimulus: `
    <p style = "text-align: start; margin-right: 50px; margin-left: 50px"> INSERT THE CONSENT FORM TEXT HERE (TO DO)</p>`,
    choices: ['I Consent', 'I Do Not Consent'],
    data: { task: 'consent' },
    on_finish: function(data){
      if(data.response === 1){
        jsPsych.data.addProperties({ reason: "participant_declined_consent" }); //log reason for non-consent
        
        document.body.innerHTML = `
        <div style="text-align:center; margin-top:100px;">
          <h3>You have chosen not to participate in this study.</h3>
          <p>Thank you for your time. You may now close this window.</p>
          <p>Or, you will be automatically redirected in 5 seconds.</p>
        </div>
      `;

      // delay redirect
      setTimeout(function() {
        window.location.href = "https://irb.ucsd.edu/participants/index.html";
      }, 5000);

      // return false prevents jsPsych from continuing the timeline
      return false;
            }
        }
    };
    //timeline.push(consent);
    
    // welcome to the experiment screen 
    // TO DO: (1) check browser speed and (2) uncomment out welcome screen 
    var welcome = {
    type: window.jsPsychHtmlButtonResponse,
    choices: ["Continue"],
    stimulus: `<p>
        Thank you for choosing to participate in this study! We are investigating how making decisions under strict time pressures relates to performance on other cognitive tasks.<br><br>
        The study has three parts. 
        </p>
        <p style="line-height:2">
        First, you will be paired with another participant online to play a game of Rock, Paper, Scissors under strict countdown timers.<br>
        Next, you will have a brief window to reflect on the game and your decision strategies with your paired opponent.<br>
        Finally, you'll complete a word-classification task on your own. This task will not be timed, so you can work at your own pace. 
        </p> 

        <p>Click <i>Continue</i> when you are ready to begin.</p>`
    };
    timeline.push(welcome); //add some call function for vsync_rate as if we are checking for a certain rate 
    
    //computer name (random assignment to popular name)
    var computerName = 
            jsPsych.randomization.sampleWithoutReplacement(
            ['Maria', 'James', 'Andre', 'Rohan', 'Zoe'], 1)[0];
    document.getElementById("opponent-label").textContent = computerName;
    

    
    //fullscreen 
    timeline.push({
        type: jsPsychFullscreen, 
        fullscreen_mode: true
    });
    

    //record browser interactions/fullscreen minimizations --> need to add this to data saved 
    function summarizeBrowserInteractions() {
        const events = jsPsych.data.getInteractionData().values();
        return {
            browser_blur_count:
                events.filter(e => e.type === "blur").length,
            browser_focus_count:
                events.filter(e => e.type === "focus").length,
            fullscreen_exit_count:
                events.filter(e => e.type === "fullscreenexit").length,
            fullscreen_enter_count:
                events.filter(e => e.type === "fullscreenenter").length,
            browser_interaction_events: JSON.stringify(events)
        };
    };

    //Practice Round => Instructions and Game 
    //instructions
    var rps_instructions = {
        type: jsPsychInstructions,
        pages: [
            // Page 1: Intro
            `
            <div class="rps-instructions">
                <h2>Rock-Paper-Scissors Task</h2>

                <p>In this study, you will play four rounds of
                rock-paper-scissors with another participant.</p>

                <p>Please read the following instructions carefully before beginning.<br>
                To make sure all participants have an equal understanding of the game, 
                you will be asked to answer a few questions about the rules before proceeding.</p>
            </div>
            `,

            // Page 2: How to play
            `
            <div class="rps-instructions">
                <h2>How to Play</h2>

                <p>Each round, you and the other participant will each choose rock, paper, or scissors.</p>

                <ul style="text-align:start; margin-left: 275px; margin-bottom: 20px">
                    <li>Rock beats scissors.</li>
                    <li>Scissors beats paper.</li>
                    <li>Paper beats rock.</li>
                    <li>If both players choose the same option, the round is a tie.</li>
                </ul>
            </div>
            `,

            // Page 3: Selecting a choice
            `
            <div class="rps-instructions">
                <h2>Selecting Your Choice</h2>

                <p>At the beginning of each round, a countdown will appear on the screen.</p>

                <p>While the countdown is running, drag your chosen
                option into your box. You can change your selection
                until the countdown ends.</p>

                <p><strong>When "GO!" appears, your selection becomes
                fixed and cannot be changed.</strong></p>

                <p>Make sure your choice is in the box before the countdown ends.</p>
            </div>
            `,

            // Page 4: Locking in a choice
            `
            <div class="rps-instructions">
                <h2>Locking In Your Choice</h2>
                <p>When "GO!" appears, press <strong>Enter</strong> or <strong>Space</strong> as quickly as possible to lock in your choice.</p>

                <p>You must respond within <strong>3 seconds</strong>.
                If you do not respond in time, your selection will not count, and you will automatically lose the round.</p>

                <p>Once both choices are locked in or the time runs out, the outcome of the round will be displayed.</p>

                <p>Your selection cannot be changed after "Go!", even before you lock it in.</p>
            </div>
            `,

            // Page 5: Game structure
            `
            <div class="rps-instructions">
                    <h2>Round Outcomes</h2>

                        // Lock the participant's selection
                        lockedIn = true;

                        choices.forEach(choice => {
                            choice.setAttribute("draggable", "false");
                            choice.style.cursor = "default";
                        });

                        enterInstruction.innerHTML = "<strong>Press ENTER or SPACE to play your choice.</strong>";
                        // OPPONENT STARTS RESPONDING (start RT)

                        computerRT = generateComputerRT();

                        computerRevealTimeout = setTimeout(
                            handleComputerLockIn,
                            computerRT
                        );

                        // PARTICIPANT RESPONSE DEADLINE (check deadline time)

                        participantTimeout = setTimeout(
                            handleParticipantTimeout,
                            MAX_RESPONSE_TIME
                        );

                    // Opponent's choice locked in
                    function handleComputerLockIn(){
                        if(trialEnded || computerLockedIn) return;

                        computerLockedIn = true; 

                        //Display "Locked In!" in computer box
                        computerBox.innerHTML = `
                        <div id="computer-question-mark" style = "font-size: 36px; font-weight: bold"></div>
                        <p style="margin-top: 5px; font-weight: bold;">Locked In!</p>
                        `; 

                        if (participantResponded){
                            triggerSimultaneousReveal()
                        }
                    }

                    // Participant response locked in 
                    function handleEnter(event) {

                        if (event.key !== "Enter" && event.code !== "Space") {
                            return;
                        }

                        if (startTime === null ||
                            participantResponded ||
                            trialEnded) {
                            return;
                        }

                        event.preventDefault();

                        // A missing choice cannot be selected after GO
                        if (selectedChoice === null) {
                            enterInstruction.innerHTML =
                                "<strong>No choice was selected. " +
                                "The round will end when time runs out.</strong>";
                            return;
                        }

                        participantResponded = true;
                        participantRT = performance.now() - startTime;

                        if (participantTimeout !== null) {
                            clearTimeout(participantTimeout);
                            participantTimeout = null;
                        }

                        if(computerLockedIn){
                            triggerSimultaneousReveal();
                        }else{
                            enterInstruction.innerHTML = `<strong>Locked in! Waiting for ${computerName}...`;
                        }
                    };

                    //REVEAL
                    function triggerSimultaneousReveal(){
                        if(syncRevealTimeout !== null || trialEnded) return;

                        enterInstruction.innerHTML = "<strong>Synchronizing moves...</strong>"; 

                        ///brief delay for reveal 
                        syncRevealTimeout = setTimeout(function(){
                            countdown.textContent ="";
                            countdown.classList.remove("practice-go");
                            showRoundResult(false)
                        }, 1200); 
                    }

                    // TIMEOUT
                    function handleParticipantTimeout() {

                        if (participantResponded || trialEnded) {
                            return;
                        }

                        participantResponded = true;
                        timeoutRT = performance.now() - startTime;

                        if(computerLockTimeout !== null){
                            clearTimeout(computerLockTimeout);
                            computerLockTimeout = null;
                        }

                        computerLockedIn = true;

                        if (selectedChoice !== null) {
                            // Force the opponent to win on timeout
                            computerChoice = getComputerChoice(
                                selectedChoice,"computer");

                        } else {
                            // No participant choice: generate an opponent move
                            computerChoice =
                                jsPsych.randomization.sampleWithoutReplacement(
                                    ["rock", "paper", "scissors"],1)[0];
                        }
                        countdown.textContent = "";
                        countdown.classList.remove("practice-go");
                        showRoundResult(true);
                    }

                    //detailed round results 
                    function getRoundMessage(player, computer, roundOutcome, timedOut){
                        if (timedOut) {
                            return `${computerName} wins! Too slow to play a move.`;
                        }

                        player = (player || "").toLowerCase();
                        computer = (computer || "").toLowerCase();

                        if (player === computer || roundOutcome === "tie") {
                            const capMove = player ? (player.charAt(0).toUpperCase() + player.slice(1)) : "choice";
                            return `Tie round! Both chose ${capMove}.`;
                        }

                        let verbPhrase = "";
                        if ((player === "paper" && computer === "rock") || (computer === "paper" && player === "rock")) {
                            verbPhrase = "Paper covers rock";
                        } else if ((player === "scissors" && computer === "paper") || (computer === "scissors" && player === "paper")) {
                            verbPhrase = "Scissors cuts paper";
                        } else if ((player === "rock" && computer === "scissors") || (computer === "rock" && player === "scissors")) {
                            verbPhrase = "Rock crushes scissors";
                        }

                        if (roundOutcome === "player") {
                            const name = typeof participantName !== 'undefined' ? participantName : "You";
                            return `${name} wins! ${verbPhrase}.`;
                        } else {
                            return `${computerName} wins! ${verbPhrase}.`;
                        }
                    }

                        if (trialEnded) {return;}

                        const resultText = getRoundMessage(selectedChoice, computerChoice, roundOutcome, timedOut);
                        feedback.innerHTML = resultText;
                        feedback.style.backgroundColor = (timedOut || roundOutcome === "computer") ? "#f8d7da" : (roundOutcome === "player" ? "#d1e7dd" : "#e2e3e5");
                        feedback.style.borderColor = (timedOut || roundOutcome === "computer") ? "#f5c2c7" : (roundOutcome === "player" ? "#badbcc" : "#d3d6d8");

                        enterInstruction.textContent = "";

                        //trial data to save
                        const isPlayerWin = roundOutcome === "player";
                        const isComputerWin = roundOutcome === "computer";
                        const isTie = roundOutcome === "tie";

                        if (isPlayerWin) {
                            player_wins++;
                        } else if (isComputerWin) {
                            computer_wins++;
                        } else if (isTie) {
                            ties++;
                        }

                        const roundComplianceIssue = timedOut || selectedChoice === null || !participantResponded;
                        if (roundComplianceIssue) {
                            participant_flagged = true; // Flag participant for review if they timed out or didn't select a choice
                        }

                        if(isFinalRound){
                            if (player_wins > computer_wins) {
                                if(participant_outcome !== 'win'){
                                    participant_outcome_issue = true; // Participant should have won but didn't
                                }
                            } else if (player_wins < computer_wins) {
                                if(participant_outcome !== 'lose'){
                                    participant_outcome_issue = true; // Participant should have lost but didn't
                                }
                            } else { // tie
                                if(participant_outcome !== 'tie'){
                                    participant_outcome_issue = true; // Participant should have tied but didn't
                                }
                            }
                        }

                        

                        // Save trial data once
                        //to do: add a variable for if someone timed out or if they did not select a choice before the countdown ended
                        jsPsych.data.addDataToLastTrial({
                            round: current_round + 1,
                            player_choice: selectedChoice,
                            computer_choice: computerChoice,
                            outcome: roundOutcome, //variable to indicate the outcome of the round (player win, computer win, tie)
                            participant_rt: timedOut ? null : Math.round(participantRT),
                            computer_rt: computerRT,
                            computer_locked_first: computerRT < participantRT,
                            selected_before_go: selectedChoice !== null, //variable to indicate if the participant selected a choice before the countdown ended (true = selected, false = did not select)
                            timed_out: timedOut, //variable to indicate if the participant timed out or not (true = timed out, false = did not time out)
                            timeout_rt: timedOut ? Math.round(timeoutRT) : null, 
                            
                            total_player_wins: player_wins,
                            assigned_wins: n_wins,
                            round_compliance_issue: roundComplianceIssue,
                            flagged: participant_flagged, // True if they missed ENTER/choice this round
                            participant_outcome_issue: participant_outcome_issue // True if their overall outcome doesn't match the predetermined outcome schedule
                        });
                        
                        //save the overall outcome and flagged status at the end of the game (after round 4)
                        if (isFinalRound) {
                            jsPsych.data.addProperties({
                                participant_outcome_issue: participant_outcome_issue, 
                                total_player_wins: player_wins,
                                total_computer_wins: computer_wins,
                                //total_ties: ties, --> never a tie so no need to save 
                                participant_flagged: participant_flagged
                            });
                        }
                        
                        if (isFinalRound) {
                            // if final round, automatically advance to the end of the game screen after a short delay (2.5 seconds)
                            continueTimeout = setTimeout(function() {
                                advanceTrial();
                            }, 2500);
                        } else {
                            continueTimeout = setTimeout(function() {
                                continueReady = true;
                                continueButton.style.display = "block";
                            }, 500);
                        }
                    }

                    function advanceTrial() {
                        if (trialEnded) {return;}
                        trialEnded = true;

                        // Remove listeners
                        document.removeEventListener("keydown", handleEnter);

                        // Clear active timers
                        if (countdownInterval !== null) clearInterval(countdownInterval);
                        if (computerRevealTimeout !== null) clearTimeout(computerRevealTimeout);
                        if (participantTimeout !== null) clearTimeout(participantTimeout);
                        if (continueTimeout !== null) clearTimeout(continueTimeout);
                        if (syncRevealTimeout !== null) clearTimeout(syncRevealTimeout);

                        current_round++;

                        jsPsych.finishTrial();
                    }

                    // Continue button to advance 
                        function handleContinue() {
                        if (!continueReady || trialEnded) {return; }

                        // Disable the button immediately so they can't double-click
                        continueButton.disabled = true;
                        continueButton.style.cursor = "not-allowed";
                        continueButton.style.opacity = "0.7";

                        continueButton.textContent = `Waiting for ${computerName}...`;

                        const jitterDelay = Math.floor(

                        // Delay advancing the trial
                        setTimeout(function() {
                            advanceTrial();
                        }, jitterDelay);
                    }

                    continueButton.addEventListener("click", handleContinue);
                    // Activate keyboard listeners
                    document.addEventListener("keydown", handleEnter);
                }
            };
        }
